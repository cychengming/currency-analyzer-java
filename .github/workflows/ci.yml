name: Java CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Analyze with SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          set +e
          ./mvnw -B -ntp sonar:sonar -Dsonar.qualitygate.wait=true > target/sonar-ci.log 2>&1
          status=$?
          set -e
          cat target/sonar-ci.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # Automatic Analysis must stay off. While it is on, SonarCloud rejects this
          # scan and the JaCoCo report from the verify step is never uploaded.
          if grep -q "Automatic Analysis is enabled" target/sonar-ci.log; then
            echo "::warning title=JaCoCo coverage was not uploaded::SonarCloud Automatic Analysis is on, so this scan was rejected. Turn it off under Project settings, Analysis Method. The next run will upload target/site/jacoco/jacoco.xml and wait for the quality gate."
            exit 0
          fi
          exit "$status"
      - name: SonarQube token not configured
        if: ${{ env.SONAR_TOKEN == '' }}
        shell: bash
        run: echo "::warning title=SonarQube skipped::Add the SONAR_TOKEN repository secret to enable SonarQube Cloud analysis."
