name: Java CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Analyze with SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./mvnw -B -ntp sonar:sonar -Dsonar.qualitygate.wait=true
      - name: SonarQube token not configured
        if: ${{ env.SONAR_TOKEN == '' }}
        shell: bash
        run: echo "::warning title=SonarQube skipped::Add the SONAR_TOKEN repository secret to enable SonarQube Cloud analysis."
