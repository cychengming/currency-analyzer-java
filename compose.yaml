services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: currency
      POSTGRES_PASSWORD: currency
      POSTGRES_DB: currency_analyzer
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency -d currency_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  currency-analyzer-java:
    build:
      context: .
    ports:
      - "${JAVA_APP_PORT:-18081}:5000"
    environment:
      PORT: 5000
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/currency_analyzer
      DATABASE_USERNAME: currency
      DATABASE_PASSWORD: currency
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-gcs}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-project-3806d7a4-0bd7-416f-8c4}
      GCP_STORAGE_BUCKET: ${GCP_STORAGE_BUCKET:-currency-analyze}
      GCP_STORAGE_PREFIX: ${GCP_STORAGE_PREFIX:-knowledge}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    # To mount a GCP service-account or ADC JSON file into the container:
    # volumes:
    #   - C:/Users/cyche/.gcp/currency-analyzer-storage.json:/run/secrets/gcp-key.json:ro
    # and set GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-key.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
