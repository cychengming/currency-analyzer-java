services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: currency
      POSTGRES_PASSWORD: currency
      POSTGRES_DB: currency_analyzer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency -d currency_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  currency-analyzer-java:
    build:
      context: .
    ports:
      - "${JAVA_APP_PORT:-18081}:5000"
    environment:
      PORT: 5000
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/currency_analyzer
      DATABASE_USERNAME: currency
      DATABASE_PASSWORD: currency
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
