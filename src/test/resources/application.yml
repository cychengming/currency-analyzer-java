spring:
  datasource:
    url: jdbc:h2:mem:currency_analyzer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: none
      embedding: none

app:
  ai:
    deepseek:
      api-key: ""
    knowledge:
      retrieval: keyword
  storage:
    provider: local
    local-directory: ${java.io.tmpdir}/currency-analyzer-test-storage
  rag:
    enabled: true
    seed-builtin-guides: false
    sync-on-startup: false
    admin-users: admin
