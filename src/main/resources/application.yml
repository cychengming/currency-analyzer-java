spring:
  application:
    name: currency-analyzer-java
  ai:
    model:
      chat: none
      embedding: none
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/currency_analyzer}
    username: ${DATABASE_USERNAME:currency}
    password: ${DATABASE_PASSWORD:currency}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: ${RAG_MAX_FILE_SIZE:5MB}
      max-request-size: ${RAG_MAX_REQUEST_SIZE:6MB}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql-migration
    baseline-on-migrate: true
    baseline-version: 0
  web:
    resources:
      cache:
        period: 0

server:
  port: ${PORT:5000}
  shutdown: graceful
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  ai:
    enabled: ${AI_ASSISTANT_ENABLED:false}
    provider: deepseek
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    max-input-chars: ${AI_MAX_INPUT_CHARS:8000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
    knowledge:
      enabled: ${AI_KNOWLEDGE_ENABLED:true}
      max-notes: ${AI_KNOWLEDGE_MAX_NOTES:4}
      max-chars: ${AI_KNOWLEDGE_MAX_CHARS:4000}
      retrieval: ${AI_KNOWLEDGE_RETRIEVAL:vector}
      similarity-threshold: ${AI_KNOWLEDGE_SIMILARITY:0.45}
      embedding-model-uri: ${AI_EMBEDDING_MODEL_URI:https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx}
      embedding-tokenizer-uri: ${AI_EMBEDDING_TOKENIZER_URI:https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json}
      embedding-cache-directory: ${AI_EMBEDDING_CACHE:${user.home}/.cache/currency-analyzer/embeddings}
  market:
    pairs: ${MARKET_PAIRS:}
    # Matches the dashboard refresh interval. Concurrent viewers share one upstream fetch.
    live-cache-ttl-seconds: ${MARKET_LIVE_CACHE_TTL_SECONDS:60}
  storage:
    provider: ${STORAGE_PROVIDER:gcs}
    local-directory: ${LOCAL_STORAGE_DIR:${user.home}/.cache/currency-analyzer/uploads}
    gcs:
      project-id: ${GCP_PROJECT_ID:project-3806d7a4-0bd7-416f-8c4}
      bucket: ${GCP_STORAGE_BUCKET:currency-analyze}
      prefix: ${GCP_STORAGE_PREFIX:knowledge}
      credentials-path: ${GCP_CREDENTIALS_PATH:}
  rag:
    enabled: ${RAG_ENABLED:true}
    seed-builtin-guides: ${RAG_SEED_BUILTIN_GUIDES:true}
    max-file-size-bytes: ${RAG_MAX_FILE_SIZE_BYTES:5242880}
    chunk-max-chars: ${RAG_CHUNK_MAX_CHARS:600}
    chunk-overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:100}
    max-chunks-per-document: ${RAG_MAX_CHUNKS_PER_DOC:500}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.45}

logging:
  level:
    root: INFO
    com.currencyanalyzer: INFO
