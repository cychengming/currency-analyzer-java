spring:
  application:
    name: currency-analyzer-java
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/currency_analyzer}
    username: ${DATABASE_USERNAME:currency}
    password: ${DATABASE_PASSWORD:currency}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  web:
    resources:
      cache:
        period: 0

server:
  port: ${PORT:5000}
  shutdown: graceful
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  ai:
    enabled: ${AI_ASSISTANT_ENABLED:false}
    provider: deepseek
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    max-input-chars: ${AI_MAX_INPUT_CHARS:8000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
  market:
    pairs: ${MARKET_PAIRS:}

logging:
  level:
    root: INFO
    com.currencyanalyzer: INFO
